[package]
name = "citree_rust"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Rust implementation of the CiTree hierarchical clustering algorithm, with Python bindings"
readme = "README.md"
repository = "https://github.com/mcasl/citree_rust"

[lib]
name = "citree_rust"
crate-type = ["cdylib", "rlib"]

[features]
# maturin enables this when building the Python extension (see pyproject.toml).
# It is left out of `default` so that `cargo test` can link against libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
anyhow = "1.0.100"
ndarray = "0.17"
numpy = "0.30"
pyo3 = "0.30"
thiserror = "2.0"

[dev-dependencies]
pretty_assertions = "1.4"

[build-dependencies]
pyo3-build-config = { version = "0.30", features = ["resolve-config"] }

[profile.release]
lto = "thin"
codegen-units = 1
